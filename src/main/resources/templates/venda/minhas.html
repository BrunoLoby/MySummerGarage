<!DOCTYPE html>
<html lang="pt-BR"
      layout:decorate="~{layout/layoutpadrao}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Minhas Compras</title>
</head>
<body>
<main layout:fragment="conteudo" th:fragment="conteudo" id="main"
      class="flex flex-col w-full m-10">

  <h2 class="text-2xl font-semibold text-gray-700 mb-6">Minhas Compras</h2>

  <div th:if="${mensagemSucesso}"
       class="mb-4 p-4 bg-green-100 text-green-800 rounded-lg" th:text="${mensagemSucesso}"></div>

  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg">
      <thead class="bg-gray-50">
        <tr>
          <th th:replace="~{components/paginacao :: coluna(${pagina}, 'dataVenda', 'Data', '')}"></th>
          <th class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Veículo</th>
          <th th:replace="~{components/paginacao :: coluna(${pagina}, 'valorFinal', 'Valor', '')}"></th>
          <th th:replace="~{components/paginacao :: coluna(${pagina}, 'status', 'Status', '')}"></th>
          <th class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Ações</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr th:if="${#lists.isEmpty(vendas)}">
          <td colspan="5" class="px-6 py-10 text-center text-gray-400">Nenhuma compra realizada.</td>
        </tr>
        <tr th:each="v : ${vendas}" class="hover:bg-gray-50">
          <td class="px-6 py-4 text-sm text-gray-700"
              th:text="${#temporals.format(v.dataVenda, 'dd/MM/yyyy')}"></td>
          <td class="px-6 py-4 text-sm text-gray-700" th:text="${v.anuncio.titulo}"></td>
          <td class="px-6 py-4 text-sm text-gray-700"
              th:text="'R$ ' + ${#numbers.formatDecimal(v.valorFinal, 1, 'POINT', 2, 'COMMA')}"></td>
          <td class="px-6 py-4 text-sm">
            <span class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800"
                  th:text="${v.status}"></span>
          </td>
          <td class="px-6 py-4 text-sm">
            <a th:hx-get="@{/venda/visualizar/{c}(c=${v.codigo})}"
               hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
               class="cursor-pointer text-blue-600 hover:text-blue-900" title="Visualizar">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
              </svg>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{components/paginacao :: paginacao(${pagina})}"></div>

</main>
</body>
</html>
