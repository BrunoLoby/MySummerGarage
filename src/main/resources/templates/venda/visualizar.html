<!DOCTYPE html>
<html lang="pt-BR"
      layout:decorate="~{layout/layoutpadrao}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Detalhes da Venda</title>
</head>
<body>
<main layout:fragment="conteudo" th:fragment="conteudo" id="main"
      class="flex flex-col w-full m-10">

  <h2 class="text-2xl font-semibold text-gray-700 mb-6">Detalhes da Venda</h2>

  <div th:if="${mensagemSucesso}"
       class="mb-4 p-4 bg-green-100 text-green-800 rounded-lg" th:text="${mensagemSucesso}"></div>

  <div class="max-w-2xl space-y-6">

    <!-- Dados da venda -->
    <div class="bg-white border border-gray-200 rounded-xl p-6">
      <h3 class="text-lg font-semibold text-gray-700 mb-4">Venda #<span th:text="${venda.codigo}"></span></h3>
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div>
          <p class="text-xs text-gray-400 uppercase font-medium">Veículo</p>
          <p class="text-gray-800 mt-1" th:text="${venda.anuncio.titulo}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-400 uppercase font-medium">Comprador</p>
          <p class="text-gray-800 mt-1" th:text="${venda.comprador.nome}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-400 uppercase font-medium">Data da Venda</p>
          <p class="text-gray-800 mt-1"
             th:text="${#temporals.format(venda.dataVenda, 'dd/MM/yyyy')}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-400 uppercase font-medium">Valor Final</p>
          <p class="text-gray-800 mt-1 font-semibold"
             th:text="'R$ ' + ${#numbers.formatDecimal(venda.valorFinal, 1, 'POINT', 2, 'COMMA')}"></p>
        </div>
        <div>
          <p class="text-xs text-gray-400 uppercase font-medium">Status</p>
          <span th:text="${venda.status}"
                class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800"></span>
        </div>
      </div>
    </div>

    <!-- Pagamentos -->
    <div class="bg-white border border-gray-200 rounded-xl p-6">
      <h3 class="text-lg font-semibold text-gray-700 mb-4">Pagamentos</h3>
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tipo</th>
            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Parcelas</th>
            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Valor</th>
            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr th:each="p : ${pagamentos}">
            <td class="px-4 py-3 text-sm text-gray-700" th:text="${p.tipo}"></td>
            <td class="px-4 py-3 text-sm text-gray-700" th:text="${p.parcelas}"></td>
            <td class="px-4 py-3 text-sm text-gray-700"
                th:text="'R$ ' + ${#numbers.formatDecimal(p.valor, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="px-4 py-3 text-sm">
              <span class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800"
                    th:text="${p.status}"></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Ações -->
    <div class="flex gap-4">
      <a hx-get="/venda/minhas" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
         class="cursor-pointer py-3 px-6 text-sm font-medium rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-100">
        Minhas Compras
      </a>
      <a hx-get="/anuncio/pesquisar" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
         class="cursor-pointer py-3 px-6 text-sm font-medium rounded-lg bg-blue-100 text-blue-800 hover:bg-blue-200">
        Ver Anúncios
      </a>
    </div>
  </div>
</main>
</body>
</html>
