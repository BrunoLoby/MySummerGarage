<!DOCTYPE html>
<html lang="pt-BR"
      layout:decorate="~{layout/layoutpadrao}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Confirmar Compra</title>
</head>
<body>
<main layout:fragment="conteudo" th:fragment="conteudo" id="main"
      class="flex flex-col w-full m-10">

  <h2 class="text-2xl font-semibold text-gray-700 mb-6">Confirmar Compra</h2>

  <!-- Resumo do anúncio -->
  <div class="max-w-2xl bg-white border border-gray-200 rounded-xl p-6 mb-6">
    <h3 class="text-lg font-semibold text-gray-700 mb-4" th:text="${anuncio.titulo}"></h3>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div>
        <p class="text-xs text-gray-400 uppercase font-medium">Marca / Modelo</p>
        <p class="text-gray-800 mt-1" th:text="${anuncio.marca + ' ' + anuncio.modelo}"></p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase font-medium">Ano</p>
        <p class="text-gray-800 mt-1" th:text="${anuncio.ano}"></p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase font-medium">Cor</p>
        <p class="text-gray-800 mt-1" th:text="${anuncio.cor ?: '-'}"></p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase font-medium">Valor anunciado</p>
        <p class="text-gray-800 mt-1 font-semibold"
           th:text="'R$ ' + ${#numbers.formatDecimal(anuncio.valor, 1, 'POINT', 2, 'COMMA')}"></p>
      </div>
    </div>
  </div>

  <!-- Formulário de compra -->
  <form th:attr="hx-post=@{/venda/comprar}" hx-target="#main" hx-swap="outerHTML"
        th:object="${vendaDTOInput}" class="max-w-2xl">

    <input type="hidden" th:field="*{codigoAnuncio}"/>

    <div th:replace="~{components/forms :: inputDinheiro(
        textoLabel='Valor final negociado (R$)',
        nomeAtributo='valorFinal',
        isValidado=true)}"></div>

    <div class="mt-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Forma de Pagamento</label>
      <select th:field="*{tipoPagamento}"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-500">
        <option value="">Selecione...</option>
        <option value="PIX">PIX</option>
        <option value="DINHEIRO">Dinheiro</option>
        <option value="CARTAO_CREDITO">Cartão de Crédito</option>
        <option value="CARTAO_DEBITO">Cartão de Débito</option>
        <option value="FINANCIAMENTO">Financiamento</option>
        <option value="TRANSFERENCIA">Transferência Bancária</option>
      </select>
      <p th:if="${#fields.hasErrors('tipoPagamento')}"
         th:errors="*{tipoPagamento}"
         class="mt-1 text-sm text-red-600"></p>
    </div>

    <div class="mt-4 w-1/3">
      <div th:replace="~{components/forms :: inputNumero(
          textoLabel='Número de parcelas',
          nomeAtributo='parcelas',
          isValidado=true,
          isDecimal=false,
          showGroups=false)}"></div>
    </div>

    <div class="flex gap-4 mt-8">
      <button type="submit"
              class="py-3 px-6 text-sm font-medium rounded-lg bg-green-100 text-green-800 hover:bg-green-200">
        Confirmar Compra
      </button>
      <a th:hx-get="@{/anuncio/visualizar/{c}(c=${anuncio.codigo})}"
         hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
         class="cursor-pointer py-3 px-6 text-sm font-medium rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-100">
        Cancelar
      </a>
    </div>
  </form>
</main>
</body>
</html>
