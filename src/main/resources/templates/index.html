<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
  <title>Página Principal</title>
</head>

<body>
 <main layout:fragment="conteudo" th:fragment="conteudo" id="main"
      class="flex flex-col items-center w-full mt-20">

    <h1 class="text-3xl md:text-5xl font-bold text-gray-700 text-center">
      Bem-vindo ao MySummerGarage
    </h1>
    <p class="text-gray-400 mt-4 text-center text-lg">
      Compre e venda carros com facilidade.
    </p>

    <div class="flex gap-4 mt-10">
      <a th:hx-get="@{/anuncio/pesquisar}" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
         class="cursor-pointer py-3 px-6 text-sm font-medium rounded-lg bg-blue-100 text-blue-800 hover:bg-blue-200">
        Ver Anúncios
      </a>
      <a th:hx-get="@{/anuncio/cadastrar}" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
         class="cursor-pointer py-3 px-6 text-sm font-medium rounded-lg bg-green-100 text-green-800 hover:bg-green-200">
        Novo Anúncio
      </a>
    </div>

  </main>
</body>
</html>
