<!DOCTYPE html>
<html lang="pt-BR"
      layout:decorate="~{layout/layoutpadrao}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Pesquisar Usuários</title>
</head>
<body>
<main layout:fragment="conteudo" th:fragment="conteudo" id="main"
      class="flex flex-col w-full m-10">

  <h2 class="text-2xl font-semibold text-gray-700 mb-6">Usuários</h2>

  <div th:if="${mensagemSucesso}"
       class="mb-4 p-4 bg-green-100 text-green-800 rounded-lg" th:text="${mensagemSucesso}"></div>

  <div class="mb-6">
    <a th:hx-get="@{/usuario/cadastrar}" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
       class="cursor-pointer py-2 px-4 text-sm font-medium rounded-lg bg-green-100 text-green-800 hover:bg-green-200">
      + Novo Usuário
    </a>
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg">
      <thead class="bg-gray-50">
        <tr>
          <th th:replace="~{components/paginacao :: coluna(${pagina}, 'nome', 'Nome', '')}"></th>
          <th th:replace="~{components/paginacao :: coluna(${pagina}, 'email', 'E-mail', '')}"></th>
          <th th:replace="~{components/paginacao :: coluna(${pagina}, 'nomeUsuario', 'Usuário', '')}"></th>
          <th class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Papéis</th>
          <th class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Ativo</th>
          <th class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">Ações</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr th:if="${#lists.isEmpty(usuarios)}">
          <td colspan="6" class="px-6 py-10 text-center text-gray-400">Nenhum usuário encontrado.</td>
        </tr>
        <tr th:each="u : ${usuarios}" class="hover:bg-gray-50">
          <td class="px-6 py-4 text-sm text-gray-800" th:text="${u.nome}"></td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${u.email}"></td>
          <td class="px-6 py-4 text-sm text-gray-600" th:text="${u.nomeUsuario}"></td>
          <td class="px-6 py-4 text-sm text-gray-600">
            <span th:each="p, i : ${u.perfis}">
              <span class="px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800"
                    th:text="${p.nome}"></span>
            </span>
          </td>
          <td class="px-6 py-4 text-sm">
            <span th:if="${u.ativo}" class="px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">Sim</span>
            <span th:unless="${u.ativo}" class="px-2 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800">Não</span>
          </td>
          <td class="px-6 py-4 text-sm">
            <div class="flex gap-3">
              <!-- Alterar -->
              <a th:hx-get="@{/usuario/alterar/{c}(c=${u.codigo})}"
                 hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
                 class="cursor-pointer text-blue-600 hover:text-blue-900" title="Alterar">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                </svg>
              </a>
              <!-- Excluir -->
              <form th:action="@{/usuario/excluir/{c}(c=${u.codigo})}" method="post"
                    onsubmit="return confirm('Confirma a exclusão deste usuário?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="cursor-pointer text-red-500 hover:text-red-800" title="Excluir">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                  </svg>
                </button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{components/paginacao :: paginacao(${pagina})}"></div>

</main>
</body>
</html>
