<!DOCTYPE html>
<html lang="pt-BR"
      layout:decorate="~{layout/layoutpadrao}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Alterar Usuário</title>
</head>
<body>
<main layout:fragment="conteudo" th:fragment="conteudo" id="main"
      class="flex flex-col w-full m-10">

  <h2 class="text-2xl font-semibold text-gray-700 mb-6">Alterar Usuário</h2>

  <form th:hx-post="@{/usuario/alterar/{c}(c=${usuarioDTOInput.codigo})}"
        th:object="${usuarioDTOInput}" class="w-full max-w-2xl">

    <div th:replace="~{components/forms :: inputTexto(
        textoLabel='Nome completo',
        nomeAtributo='nome',
        isValidado=true)}"></div>

    <div th:replace="~{components/forms :: inputEmail(
        textoLabel='E-mail',
        nomeAtributo='email',
        isValidado=true)}"></div>

    <div class="flex gap-6">
      <div class="w-1/2">
        <div th:replace="~{components/forms :: inputTexto(
            textoLabel='Nome de usuário',
            nomeAtributo='nomeUsuario',
            isValidado=true)}"></div>
      </div>
      <div class="w-1/2">
        <div th:replace="~{components/forms :: inputSenha(
            textoLabel='Nova senha (deixe em branco para manter)',
            nomeAtributo='senha',
            isValidado=true)}"></div>
      </div>
    </div>

    <div class="flex gap-6 items-start">
      <div class="w-1/2">
        <div th:replace="~{components/forms :: checkboxMultiplo(
            textoLabelGroup='Papéis',
            nomeAtributo='papeis',
            listaOpcoes=${todosPapeis},
            propLabel='nome',
            propValue='codigo',
            isValidado=true)}"></div>
      </div>
      <div class="w-1/2 mt-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Ativo</label>
        <input type="checkbox" th:field="*{ativo}"
               class="w-4 h-4 text-blue-600 border-gray-300 rounded"/>
      </div>
    </div>

    <div class="flex gap-4 mt-8">
      <button type="submit"
              class="py-3 px-6 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200">
        Salvar
      </button>
      <a th:hx-get="@{/usuario/pesquisar}" hx-target="#main" hx-swap="outerHTML" hx-push-url="true"
         class="cursor-pointer py-3 px-6 text-sm font-medium rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-100">
        Cancelar
      </a>
    </div>
  </form>
</main>
</body>
</html>
